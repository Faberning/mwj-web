name = "mwj-web"
main = "worker/index.js"
compatibility_date = "2026-07-14"
# Production is served only on mortgageswithjj.co.nz. The *.workers.dev copy
# was a duplicate of the whole site under a second address.
workers_dev = false
preview_urls = false
account_id = "d4c8bcc6bebc81d6e41b0c90ca3af7f6"

[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare Email Routing send_email binding — restricted to these verified
# destinations at the platform level (no third-party email API, no secrets).
# Keep in step with NOTIFY_ADDRESS / CARD_NOTIFY_ADDRESSES in worker/index.js.
[[send_email]]
name = "SEND_EMAIL"
allowed_destination_addresses = ["freddieberning1@gmail.com", "jj@mortgagedesign.co.nz"]
