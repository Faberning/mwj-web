# Auto-deploy mortgageswithjj.co.nz to Cloudflare.
# - Pull request: build only. Nothing goes live.
# - Merge to main (Freddie's approval): build, `wrangler deploy`, live crawler check.
# - "Run workflow" button in the Actions tab: redeploy main by hand, from any device.
#
# Needs one repo secret (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template, made in the
#                          freddieberning@gmail.com account (d4c8bcc6), which owns mwj-web
# The account id is pinned below, which stops wrangler picking the wrong account.
name: Deploy to Cloudflare

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d4c8bcc6bebc81d6e41b0c90ca3af7f6  # freddieberning@gmail.com account (not secret)
          command: deploy
      - name: Live check (AI crawlers get 200, no challenge page)
        # The form round-trip in scripts/postdeploy-check.sh is left out on
        # purpose: it would email a test lead on every deploy.
        run: |
          sleep 10
          URL=https://mortgageswithjj.co.nz
          fail=0
          for UA in ClaudeBot GPTBot PerplexityBot; do
            CODE=$(curl -s -A "$UA" -o /dev/null -w "%{http_code}" "$URL/")
            echo "$UA -> $CODE"; [ "$CODE" = "200" ] || fail=1
          done
          curl -s "$URL/" | grep -qiE 'cf-mitigated|just a moment|__cf_chl' && { echo "challenge page served"; fail=1; }
          exit $fail
